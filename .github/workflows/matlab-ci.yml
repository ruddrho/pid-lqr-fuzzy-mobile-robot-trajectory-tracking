name: MATLAB CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b

      - name: Run MATLAB smoke test
        uses: matlab-actions/run-command@v3
        with:
          command: |
            files = dir("*.m");
            assert(~isempty(files), "No MATLAB files found.");

            run("main.m");

            disp("MATLAB project smoke test completed.");
